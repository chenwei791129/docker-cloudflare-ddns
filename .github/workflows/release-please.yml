name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # release-please itself lives in chenwei791129/.github; see the build job
  # below for why the shared workflows are used.
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: chenwei791129/.github/.github/workflows/release-please.yml@main
    with:
      release-type: go

  # The build itself lives in chenwei791129/.github so the pinned action
  # versions are maintained in exactly one place across repositories. It
  # replaces the former local build-image.yml, which existed only to wrap the
  # same steps behind a `version` input.
  #
  # Publishes to ghcr.io only. The Docker Hub push was dropped deliberately: its
  # pull-rate and retention limits keep tightening, and this account is
  # standardising on ghcr.io.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      # ghcr path keeps the short image name this project published under,
      # rather than the docker- prefixed repository name.
      image-name: chenwei791129/cloudflare-ddns
      # Tags are derived from the release-please tag rather than the pushed ref,
      # because this job runs on the release commit pushed to main, not on the
      # tag itself, so the shared semver defaults would find no version to read.
      enable-branch-tag: false
      enable-latest-tag: false
      enable-semver-tags: false
      additional-tags: |
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
        type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
        type=raw,value=latest
